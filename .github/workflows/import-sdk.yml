name: Temporary SDK import

on:
  push:
    branches:
      - main
    paths:
      - .transfer-import/ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer-import/chunk-* > /tmp/ranobelib-node-sdk.tar.gz.b64
          base64 -d /tmp/ranobelib-node-sdk.tar.gz.b64 > /tmp/ranobelib-node-sdk.tar.gz
          expected_sha="$(tr -d '\r\n' < .transfer-import/archive.sha256)"
          actual_sha="$(sha256sum /tmp/ranobelib-node-sdk.tar.gz | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          expected_size="$(tr -d '\r\n' < .transfer-import/archive.size)"
          actual_size="$(stat -c '%s' /tmp/ranobelib-node-sdk.tar.gz)"
          test "$actual_size" = "$expected_size"
          tar -xzf /tmp/ranobelib-node-sdk.tar.gz

      - name: Retarget package metadata to the new repository
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/iooe/ranobelib-node-sdk.git'
          };
          pkg.bugs = { url: 'https://github.com/iooe/ranobelib-node-sdk/issues' };
          pkg.homepage = 'https://github.com/iooe/ranobelib-node-sdk#readme';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://github.com/iooe/RanobeParser/tree/agent/ranobelib-node-sdk": "https://github.com/iooe/ranobelib-node-sdk",
              "git+https://github.com/iooe/RanobeParser.git": "git+https://github.com/iooe/ranobelib-node-sdk.git",
              "https://github.com/iooe/RanobeParser/issues": "https://github.com/iooe/ranobelib-node-sdk/issues",
              "github:iooe/RanobeParser#agent/ranobelib-node-sdk": "github:iooe/ranobelib-node-sdk",
          }
          for filename in ("README.md", "README.ru.md", "docs/API.md", "docs/PRODUCTION.md"):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install and validate package
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run check
          node scripts/live-smoke.mjs

      - name: Commit production repository contents
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bootstrap
          rm -rf .transfer-import
          rm -f .github/workflows/import-sdk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import production RanobeLib Node.js SDK"
          git push origin main
