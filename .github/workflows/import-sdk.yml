name: Temporary SDK import

on:
  push:
    branches:
      - main
    paths:
      - .transfer-import/ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-25c0-81f4-b450-5a646f577895/raw?se=2026-08-15T18%3A54%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=587c0f10-75d7-579e-bde8-e8a096514f92&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T06%3A47%3A34Z&ske=2026-08-16T06%3A47%3A34Z&sks=b&skv=2026-02-06&sig=zMe3EWUUEAndmapX1Y1sUPAPJ7MMBAewqgEjv2fTPQA%3D' \
            --output /tmp/ranobelib-node-sdk-transfer.zip
          echo 'b4f66418db7922498fe64dea7569b9718080cfcd18c64068ec7bb0d7cba1c293  /tmp/ranobelib-node-sdk-transfer.zip' | sha256sum --check
          mkdir -p /tmp/ranobelib-node-sdk-transfer
          unzip -q /tmp/ranobelib-node-sdk-transfer.zip -d /tmp/ranobelib-node-sdk-transfer
          test "$(stat -c '%s' /tmp/ranobelib-node-sdk-transfer/ranobelib-node-sdk.tar.gz)" = '108711'
          echo 'beb7258235ac9cf46527daa4c3c577167fddaf9c7ac1f62164c32a40fde8cf14  /tmp/ranobelib-node-sdk-transfer/ranobelib-node-sdk.tar.gz' | sha256sum --check
          tar -xzf /tmp/ranobelib-node-sdk-transfer/ranobelib-node-sdk.tar.gz

      - name: Retarget package metadata to the new repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f ranobelib-node-sdk-chunk-*.b64
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/iooe/ranobelib-node-sdk.git'
          };
          pkg.bugs = { url: 'https://github.com/iooe/ranobelib-node-sdk/issues' };
          pkg.homepage = 'https://github.com/iooe/ranobelib-node-sdk#readme';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://github.com/iooe/RanobeParser/tree/agent/ranobelib-node-sdk": "https://github.com/iooe/ranobelib-node-sdk",
              "git+https://github.com/iooe/RanobeParser.git": "git+https://github.com/iooe/ranobelib-node-sdk.git",
              "https://github.com/iooe/RanobeParser/issues": "https://github.com/iooe/ranobelib-node-sdk/issues",
              "github:iooe/RanobeParser#agent/ranobelib-node-sdk": "github:iooe/ranobelib-node-sdk",
          }
          for filename in ("README.md", "README.ru.md", "docs/API.md", "docs/PRODUCTION.md"):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install and validate package
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          node scripts/live-smoke.mjs

      - name: Commit validated source without workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bootstrap
          rm -rf .transfer-import
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/live-smoke.yml
          rm -f .github/workflows/publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import production RanobeLib Node.js SDK"
          git push origin main
